# RD-1 A0 语义冻结（rule_version: rd1_a0_v1）
# 冻结时间: 2026-09-06T12:12:39Z UTC
# 数据: RWTH M5BAT DOI 10.18154/RWTH-2025-06555, 本地 Dataset/ 下 4 CSV
# 纪律: 本文件只冻结语义/口径，不含算法与结论；schedule 一律称优化计划(MILP 输出)，
#       禁止称外部实时命令或物理限值。

source:
  doi: 10.18154/RWTH-2025-06555
  local_root: "D:/Users/Micko/Documents/工作/华润集控/光储充/数据/RWTH/Dataset"
  files:
    - test_1_measurement_data.csv   # 2023-08-14 12:00 -> 2023-08-17 12:00, 1s, 259201x15
    - test_1_schedule_data.csv      # 与 measurement 不重叠，仅作口径参考，不进 A2
    - test_2_measurement_data.csv   # 2024-05-28 12:00 -> 2024-05-31 12:00, 1s, 259201x15
    - test_2_schedule_data.csv      # 15min, 288x17, 与 test_2 measurement 同标签

timezone_semantics:
  internal_alignment: raw label offset 0   # 实证: schedule vs measurement 15min 聚合 corr=1.000, MAE=11.65kW, 唯一最优 offset
  supplementary_note: "schedule=UTC+1 / measurement=UTC+2（补充材料标注）"
  resolution: 补充材料时区标注与标签对齐实证矛盾；对内分析一律使用 raw label offset 0；
    绝对 UTC 映射标记 UNRESOLVED，任何需要绝对 UTC 的外部对齐前必须先解决。
  test_1_schedule: NOT_ALIGNED（与 measurement 零重叠），禁止用于对齐回放。

sign_convention:
  power: positive = discharge              # 实证: power 与 dSOC/dt 相关系数为负（bess -0.34, 各单元 -0.25~-0.40, NaN 安全复核后 lmo4=-0.251）
  soc: percent, 0-100
  applies_to: [bess_power_ac, lmo*_power_ac, lmo*_power_dc, schedule 同名字段]

units_and_boundaries:
  exposed_units: [lmo1, lmo2, lmo3, lmo4]  # 全部 LMO 同技术；公开集无其他单元通道
  unit_rated_power_estimate_kw: 630        # measured 极值 ±633 / schedule 极值 +599.6/-630; estimated, 待补充材料确认
  station_channels:
    bess_power_ac: 站级(段级)交流表计, 含站级开销, 不等于单元之和(见 A1)
    bess_soc: 实证 = 四单元 SOC 等权均值(corr=1.0000)
  measurement_plane: AC 通道为分析平面
  dc_channel_caveat: >
    per-unit AC/DC 中位比 lmo1=0.718 / lmo2=0.980 / lmo3=1.020 / lmo4=0.971 ——
    各单元 DC 通道测量点/标定不一致，lmo3 出现 AC>DC；
    禁止跨单元直接比较 DC 通道，禁止未经标定用 DC 通道做效率或损耗结论。

sampling:
  measurement: 1s 连续（test_1/test_2 均 0 缺口, 259201 行）
  schedule: 15min, 288 行

schedule_semantics:
  nature: M5Use MILP 优化计划, 非外部实时命令, 非物理限值
  station_column_semantics: >
    schedule 的 bess_power_ac 是净交换量，与单元列之和不可直接核验：
    test_2 全部 288 行 |bess - sum|>0.5kW，其中 170 行为"单元有功率但站级净=0"的
    内部环流模式（如单单元 14.034kW、trafo 两组 +7.0056/-7.0056 对消）。
  implication: A2/A3 的 schedule-vs-actual 比较在单元平面进行，禁止站级平面直接分解。

a1_gate:
  hard_gate_owner: 用户
  station_plane_result: FAIL_at_tight_tolerance（详见 A0/A1 报告 §4）
  pending_decision: 按 gate 原文 STOP，或按单元平面重解释后放行 A2/A3（报告 §6 建议，待确认）
