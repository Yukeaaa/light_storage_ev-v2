# P2 机器可审计动作 Schema + 状态机 + 边界模式 + 冻结阈值（v1.0，2026-08-11）
# 依据：Patent Gate 2 FINAL（results/raw/patent_gate2/patent_gate2_final.md，NARROW CONDITIONAL GO）。
# 冻结效力：本文件与 reports/patent_definition/phase3_p2_preregistration_v1.0.md 同步冻结；
# 任何改动 = 新版本 + 新测试协议。P2 只验证机制成立率，不验证性能/收益/active redistribution。

experiment_id: P2_v1
protocol_version: phase3_p2_preregistration_v1.0
frozen_date: 2026-08-11
gate2_verdict: NARROW_CONDITIONAL_GO
scope: mechanism_realizability_only

# --- 状态机（会话内逐 1-min cycle 推进；P2 只允许这三个状态）---
state_machine:
  states:
    - UNASSESSED     # 信息/历史不足，尚未进入任何执行模式
    - PROTECTIVE     # M3/M4 边界 → 保护性动作集（SHRINK_ONLY）
    - NORMAL         # M1/M2 边界 → 有界修正动作集
  transitions:
    - {from: UNASSESSED, to: [PROTECTIVE, NORMAL], via: info_mode_lookup}
    - {from: PROTECTIVE, to: NORMAL, via: recovery_trigger}     # 唯一恢复路径（D3）
    - {from: NORMAL, to: PROTECTIVE, via: degrade_trigger}      # 信息类别退化（如 pilot 丢失）
  forbidden_transitions:
    - "PROTECTIVE -> NORMAL 不得由：通信恢复 / 停充解除 / 人为 reset / 计时到期"
    - "任何状态切换不得由 recent_var / confidence score / classifier 驱动"

# --- D1：信息模式 → 边界生成模式（确定性查表，无拟合、无学习）---
information_modes:
  M1_capability_rich:        {has_capability: true,  has_pilot: true,  has_actual: true}
  M2_pilot_actual:           {has_capability: false, has_pilot: true,  has_actual: true}
  M3_current_only:           {has_capability: false, has_pilot: false, has_actual: true}
  M4_history_insufficient:   {history_samples: "< min_history_samples"}

boundary_mode_selection:     # 确定性查表：info_mode -> boundary_mode
  M1_capability_rich:        capability_supported_boundary
  M2_pilot_actual:           response_history_boundary
  M3_current_only:           history_protective_boundary
  M4_history_insufficient:   conservative_fallback

# --- 边界生成器（M3/M4 为 P2 实际计算对象；M1 因数据天然无 capability 仅作注入回放验证）---
boundary_generators:
  capability_supported_boundary:
    source: capability_info
    natural_data: absent          # ACN 数据无 BMS capability → 仅 capability-injection replay 验证
    frozen: true
  response_history_boundary:
    source: pilot + actual 响应/历史派生
    frozen: true
  history_protective_boundary:
    source: rolling_actual_power
    window_min: 15
    quantile: 0.95                # 保守上界（冻结；改动 = 新版本）
    min_samples: 5                # 低于此 → M4（冻结）
  conservative_fallback:
    source: "不输出未支持区间；allowed interval 冻结为 [0, 0]（禁止任何预算修正）"
    frozen: true

# --- D2：约束等级 → 允许预算修正区间（机器可执行动作边界）---
constraint_levels:
  protective:                    # M3/M4 → PROTECTIVE 状态
    allowed_delta_interval: [-current_budget, 0]
    action: SHRINK_ONLY          # 可收缩、可保持；禁止按"allocated - actual"上调
    release_source_forbidden: "allocated - actual"
  supported:                     # M1/M2 → NORMAL 状态
    allowed_delta_interval: [-current_budget, max(0, boundary_value - current_budget)]
    action: BOUNDED_CORRECTION   # 有界修正，上界由边界支撑容量决定，非差值释放

action_disposition:              # 候选 EMS 预算修正量 ΔP 的约束方式
  - {condition: "requested_delta within [L, U]",            disposition: accepted,     final: requested_delta}
  - {condition: "requested_delta > U",                      disposition: clipped_upper, final: U}
  - {condition: "requested_delta < L",                      disposition: clipped_lower, final: L}

# --- D3：恢复触发（物理、最简、预注册冻结；第一版禁止任何学习/置信度组件）---
recovery_trigger:
  type: boundary_contact_support
  condition: "actual_power >= 0.95 * protective_bound"
  sustained_cycles: 3            # 连续 3 个 1-min cycle，同一 uninterrupted run
  exclusion_of_trigger: [comms_recovery, plug_out, session_reset, timer_expiry]
  forbidden_models_v1: [confidence_score, variance_plus_slope, classifier, dual_timescale,
                        learned_recovery_probability]
  policy: "若本物理触发无法产生可用 recovery trace → 优先 No-Go，不加模型救场"

# --- 主指标（机制成立率，非性能/收益）---
primary_metrics:
  M1_D1_branch_realizability:  # 信息类别 → 预定义 boundary_mode 确定性选择比例（目标 1.0）
    kind: determinism
    target: 1.0
  M2_D2_action_bound_realizability:  # 有效 cycle 生成明确 allowed interval 并实际约束候选动作比例（目标 1.0）
    kind: determinism
    target: 1.0
  M3_D3_recovery_trace_existence:    # 完整自然 recovery trace 计数
    kind: count
    minimum_traces: 20
    minimum_sessions: 5
  M4_unsupported_release_prevention: # PROTECTIVE 下 allocated>actual 时正向 release 比例（目标 0.0）
    kind: correctness
    target: 0.0

# --- Step0 kill gates（正式统计前；仅 jpl train + mask replay；test 单次暴露前全部完成）---
step0_kill_gates:
  K1_D1_mode_selection:
    question: "信息面变化是否真的产生不同 boundary mode？"
    fail_verdict: STOP            # D1 不成立
  K2_D2_action_set:
    question: "权限等级能否编码为数值 action set 并改变 accept/clip/reject？"
    fail_verdict: PROJECT_NO_GO   # 硬杀线，与 Gate 2 冻结规则一致
  K3_D3_recovery_trace:
    question: "是否存在不依赖通信恢复/停充/reset、由实际充电响应触发的 recovery trace？"
    fail_verdict: LIKELY_PROJECT_NO_GO

# --- 数据与切分 ---
data:
  primary_embodiment: jpl_current_only     # 自然 M3 域：pilot 不可用 → protective action set
  pilot_rich_replay: caltech               # 信息面回放：mask pilot / truncate history / inject capability
  replay_role: mode_mechanism_replay       # 不是真实站点分布统计（协议必须明示）
  split:
    fit: jpl_train
    test: jpl_test_single_exposure
    office001: external_only               # 不得用于改任何阈值
  source_tables: E0 冻结 1-min 会话表        # 不引入新数据工程

# --- 排除项（Gate 2 / P1 冻结，P2 不得重新引入）---
exclusions:
  - recent_var 高低作为核心状态规则
  - variance-defined S1/S2 作为状态判定
  - broad active redistribution（把差值给别人）
  - PV/BESS benefit / 经济收益指标
  - 为绕 prior art 的复杂度（risk score、双模型、classifier、learned recovery probability）
  - 把 mask replay 当作真实站点分布统计
