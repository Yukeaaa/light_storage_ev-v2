# P2 机器可审计动作 Schema + 状态机 + 边界模式 + 冻结阈值（v1.0.2，2026-08-11）
# 依据：Patent Gate 2 FINAL（results/raw/patent_gate2/patent_gate2_final.md，NARROW CONDITIONAL GO）
#       + Review 66（CONDITIONAL FAIL，P0 接口闭环）+ Review 67（CONDITIONAL FAIL，执行级 hotfix）。
# 冻结效力：本文件与 reports/patent_definition/phase3_p2_preregistration_v1.0.2.md 同步冻结；
# 任何改动 = 新版本 + 新测试协议。P2 只验证机制成立率，不验证性能/收益/active redistribution。

experiment_id: P2_v1_0_2
protocol_version: phase3_p2_preregistration_v1.0.2
frozen_date: 2026-08-11
gate2_verdict: NARROW_CONDITIONAL_GO
scope: mechanism_realizability_only

# --- v1.0.1 changelog（Review 66 修复清单）---
v1_0_1_changelog:
  - P0-1: "D2 动作输入冻结来源：controller-conformance replay + 外生 budget/probe 规则（禁止按 [L,U] 反向生成）；M2 语义 = final==clip(requested,L,U) 且 disposition 唯一，不再要求每 cycle requested!=final"
  - P0-2: "三层解耦：information_mode → boundary_mode 固定映射；application_state/constraint_level 独立变化。M3 recovery 后仍用 history_protective_boundary，仅提升权限等级。M4=LOCKED/[0,0] 唯一化；M4 无 protective_bound，不得触发 D3"
  - P0-3: "D1 查表改为穷尽 precedence（capability 优先 + history-insufficient 仅作用于 pilot/actual 分支 + 未覆盖组合 fail-closed 到 M4）"
  - P0-4: "D3 因果化：protective_bound 只用当前 cycle 之前数据（shift(1)），绑定 E0 actual_power_kw/severe_gap_before；protective_bound<=0 禁止恢复；0.95 与连续 3 cycle 数值不变"
  - P0-5: "M1/M2 本轮只验证 branch dispatch，不参与 D2/D3 数值门；D2/D3 自然实施例只在 M3/M4 上验证"
  - P1-1: "Step0 用全部冻结 JPL train + 固定 Caltech replay（不挑样本）；Success ≥20 traces/≥5 sessions 必须是 natural JPL；replay 单列辅助不计入自然轨迹；JPL current-only test 域曾被 E3 分析，P2 只能声称 outcome single exposure，不得声称未分析过的独立 test"
  - P1-2: "继承 P1 fail-closed 治理：code SHA + protocol/schema SHA + clean worktree + sentinel；sentinel 存在即消费 P2 exposure"
  - fix: "accept/clip/reject 统一为 accepted / clipped_upper / clipped_lower，删除 reject"
  - fix: "K3 出口唯一化为 PROJECT_NO_GO（Step0 与穷尽映射一致）"

# --- v1.0.2 changelog（Review 67 执行级接口 hotfix；未改任何冻结阈值/科学规则）---
v1_0_2_changelog:
  - P0-1: "D1 precedence 改为结构化机器可执行条目（if/mode + else: fail_closed）；删除 '-> M' 隐式目标字段（PyYAML 会把 '-> M1' 解析成值为 null 的键）"
  - P0-2: "冻结 state_persistence：application_state 在 information_mode 不变的 cycle 间持续保持；default 仅 run_start / information_mode_entry / severe_gap_reset 应用；禁止每 cycle 重查 default"
  - P1-1: "master 冻结效力行仍指向已删除 v1.0.md → 修正为 v1.0.2.md（authority 冲突消除）"
  - P1-2: "K3 穷尽映射删除 '含 replay 后'：JPL train natural trace = 0 → PROJECT_NO_GO；replay 不得救"
  - freeze: "md5hex 机械冻结：MD5(UTF-8 session_id) 首字节 seed_byte=int(md5_hex[0:2],16)；cycle_index=0-based 不间断 run 内递增"

# --- 三层解耦（P0-2）---
# Layer 1: information_mode（每 cycle 由可用信息决定，确定性）
# Layer 2: boundary_mode（information_mode 的固定映射，不变）
# Layer 3: application_state / constraint_level（独立变化：M4=LOCKED / M3 默认 PROTECTIVE /
#          M1/M2 默认 NORMAL；M3 经 D3 recovery → NORMAL，boundary_mode 仍是 history_protective_boundary）

state_machine:
  states: [LOCKED, PROTECTIVE, NORMAL]   # application_state（Layer 3），不再与信息模式混绑
  layer1_information_modes: [M1_capability_rich, M2_pilot_actual, M3_current_only, M4_history_insufficient]
  layer2_boundary_modes:
    M1_capability_rich: capability_supported_boundary
    M2_pilot_actual: response_history_boundary
    M3_current_only: history_protective_boundary
    M4_history_insufficient: conservative_fallback
  default_application_state:            # 每信息模式的默认状态（固定表；仅进入时应用，见 state_persistence）
    M1_capability_rich: NORMAL
    M2_pilot_actual: NORMAL
    M3_current_only: PROTECTIVE
    M4_history_insufficient: LOCKED
  state_persistence:                    # v1.0.2（Review 67 P0-2）
    rule: "application_state persists across cycles while information_mode is unchanged"
    default_applies_on:
      - run_start
      - information_mode_entry
      - severe_gap_reset               # 同 run 内 severe_gap / run 重置后重新应用默认态
    forbidden:
      - "reapply default_application_state every cycle"
      - "info_mode 未变时按 default 表重查 state（M3 recovery→NORMAL 后下一 cycle 不得掉回 PROTECTIVE）"
  transitions:
    - {from: LOCKED, to: PROTECTIVE, via: info_mode_change}        # M4→M3（历史达到 min_samples，信息驱动，非 D3）
    - {from: PROTECTIVE, to: NORMAL, via: recovery_trigger}        # 唯一 D3 恢复；仅 M3+PROTECTIVE 可触发
    - {from: NORMAL, to: PROTECTIVE, via: degrade_trigger}         # 信息退化（如 M2→M3 / M1→M3）
    - {from: NORMAL, to: LOCKED, via: info_mode_change}            # 信息退化到 M4
  recovery_restriction:
    rule: "D3 recovery 仅对 M3_current_only + history_protective_boundary 生效；recovery 只提升
           application_state（PROTECTIVE→NORMAL），boundary_mode 不变（仍 history_protective_boundary）"
    forbid: "M4（LOCKED，无 protective_bound）不得直接触发 D3；M1/M2 已是 NORMAL，无 recovery"
  forbidden_transitions:
    - "PROTECTIVE -> NORMAL 不得由：通信恢复 / 停充解除 / 人为 reset / 计时到期"
    - "任何状态切换不得由 recent_var / confidence score / classifier 驱动"
    - "M4 -> NORMAL 或 M4 -> M3 后直接 NORMAL 均禁止：M4 必须先经 info_mode_change 到 M3+PROTECTIVE"

# --- D1：穷尽 precedence 查表（P0-3；v1.0.2 结构化 if/mode 机器可执行，P0-1）---
d1_lookup:
  precedence:            # 从上到下第一条命中的规则即最终信息模式（穷尽、互斥、机器可执行）
    - if: "capability_available == true"
      mode: M1_capability_rich
    - if: "pilot_available and actual_available and history_sufficient"
      mode: M2_pilot_actual
    - if: "pilot_available and actual_available"
      mode: M4_history_insufficient
    - if: "actual_available and history_sufficient"
      mode: M3_current_only
    - if: "actual_available"
      mode: M4_history_insufficient
    - else: fail_closed
      mode: M4_history_insufficient
  history_sufficiency:
    definition: "当前 cycle 之前、同一 run 内、非 severe_gap 的 `actual_power_kw` 非空样本数 >= min_history_samples"
    min_history_samples: 5          # 冻结；低于此 → M4（conservative fallback）
  fail_closed: "任何未覆盖组合一律 M4_history_insufficient（保守回退，绝不输出未支持区间）"
  note: "capability 独立于 history 成立（capability=true 即 M1，不受 history 充分性影响）；
        history-insufficient 只作用于 pilot/actual 派生分支（M2/M3）；capability=true 但 pilot=false
        → 规则 1 命中 → M1；实现直接加载本 precedence 表（if/mode/else 字段），禁止二次解释文字"

# --- 边界生成器（P0-5：M1/M2 dispatch-only；M3/M4 为 D2/D3 数值门对象）---
boundary_generators:
  capability_supported_boundary:
    source: capability_info
    natural_data: absent            # ACN 无 BMS capability → 仅 injection replay 验证 dispatch
    dispatch_only: true             # 不参与 D2/D3 数值门
    injection_value_kw: 7.2         # 冻结的合成 capability（固定标量，全 replay 一致，非数据派生）
    frozen: true
  response_history_boundary:
    source: pilot + actual 响应/历史派生
    dispatch_only: true             # v1.0.1：M2 只验证 branch dispatch，不参与 D2/D3 数值门
    frozen: true
  history_protective_boundary:      # M3；D2/D3 数值门的自然 embodiment
    source: actual_power_kw          # E0 冻结 active-power（measured→computed→estimated，含 power_source）
    window_min: 15
    quantile: 0.95                   # 保守上界（冻结；数值本轮不改）
    min_samples: 5                   # 与 history_sufficiency.min_history_samples 一致
    causality: shift(1)              # protective_bound(t) 只用 [t-window, t-1] 数据；当前 cycle 不参与构造自身边界
    run_definition: "同一 session 内连续 cycle 且 gap_before_min < severe_gap_min(20min)；severe_gap_before=true 时滚动窗重置"
    reset_rule: "rolling 窗遇 severe_gap_before 重置；窗内样本计数重新从 0 起算（与 gap/reset 语义绑定 E0 severe_gap_before）"
    frozen: true
  conservative_fallback:            # M4；LOCKED/[0,0]（唯一化，P0-2）
    source: "不输出未支持区间；allowed interval 冻结为 [0, 0]（禁止任何预算修正）；无 protective_bound"
    boundary_value: null
    frozen: true

# --- D2：动作输入来源（P0-1；controller-conformance replay + 外生规则）---
candidate_action:
  source_kind: controller_conformance_replay
  rationale: "ACN 无真实 EMS budget/request 字段；P2 不验证调度器性能，只验证控制器约束行为"
  current_budget_source:           # 外生：与 boundary/actual/state/outcome 无关
    rule: "B(t) = 3.0 + 1.5 * (md5hex(session_id) 首字节 mod 4)"      # {3.0, 4.5, 6.0, 7.5} kW
    frozen: true
  requested_delta_source:          # 外生 probe：固定网格按 cycle 轮转，禁止按 [L,U] 反向生成
    rule: "probe_grid=[-3.0,-1.5,0.0,+1.5,+3.0] kW; probe(t)=probe_grid[(cycle_index+md5hex(session_id)首字节 mod 5) mod 5]"
    frozen: true
    independence: "probe 生成不读取 boundary_value / allowed interval / actual_power_kw / application_state / outcome"
  seeding_definition:                # v1.0.2：md5hex 机械冻结（消除"首字节"实现自由度）
    hash: "MD5(UTF-8 session_id)；session_id = E0 会话表原始字符串（不 trim、不规范化）"
    seed_byte: "int(md5_hex[0:2], 16)   # 首字节 = MD5 hex 前两位"
    cycle_index: "0-based；同一不间断 run 内自 0 递增（run 定义绑定 E0 severe_gap_before/gap_before_min）"
    frozen: true
  allocated_definition: "allocated == current_budget（同一变量，不独立存在）"
  implementation_audit: "实现必须把 budget/probe 的生成与 boundary/state 计算分离并记录
                         probe_seed/budget_seed；审查可复核 probe 与 [L,U] 无依赖"

# --- D2：约束等级 → 允许预算修正区间（机器可执行动作边界；三层解耦后按 application_state）---
constraint_levels:
  locked:                          # M4 → LOCKED
    allowed_delta_interval: [0.0, 0.0]     # 禁止任何预算修正（唯一化，不再与 PROTECTIVE 混写）
    action: NO_CORRECTION
  protective:                      # M3 默认 → PROTECTIVE
    allowed_delta_interval: [-current_budget, 0.0]
    action: SHRINK_ONLY            # 可收缩、可保持；禁止按"allocated - actual"上调
    release_source_forbidden: "allocated - actual"
  normal:                          # M1/M2 默认 → NORMAL；M3 经 D3 recovery 后亦为 NORMAL（boundary 不变）
    allowed_delta_interval: [-current_budget, max(0.0, boundary_value - current_budget)]
    action: BOUNDED_CORRECTION     # 上界由边界支撑容量决定，非差值释放

action_disposition:              # 唯一 disposition 语义（P0-1 / fix：无 reject）
  - {condition: "L <= requested_delta <= U",        disposition: accepted,     final_delta: requested_delta}
  - {condition: "requested_delta > U",              disposition: clipped_upper, final_delta: U}
  - {condition: "requested_delta < L",              disposition: clipped_lower, final_delta: L}

# --- D3：恢复触发（物理、最简、预注册冻结；因果化后防假阳性）---
recovery_trigger:
  type: boundary_contact_support
  condition: "protective_bound > 0 AND actual_power_kw >= 0.95 * protective_bound"
  sustained_cycles: 3            # 连续 3 个 1-min cycle，同一 run（数值不变）
  causality: "protective_bound(t) 只用 <t 的数据（shift(1)），actual_power_kw(t) 为当前 cycle 实测"
  protective_bound_zero_guard: "protective_bound <= 0 时不得触发（排除 0 >= 0.95*0 自动恢复）"
  binding_fields:
    - "actual_power_kw（E0 冻结 active-power，measured→computed→estimated）"
    - "severe_gap_before / gap_before_min（E0 冻结 run 与 reset 语义）"
    - "pilot_available / pilot_power_kw（E0 冻结）"
  exclusion_of_trigger: [comms_recovery, plug_out, session_reset, timer_expiry]
  forbidden_models_v1: [confidence_score, variance_plus_slope, classifier, dual_timescale,
                        learned_recovery_probability]
  policy: "若本物理触发无法产生可用 recovery trace → 优先 No-Go，不加模型救场"

# --- 主指标（机制成立率；P0-1 修正 M2 语义）---
primary_metrics:
  M1_D1_branch_realizability:  # 信息类别 → 预定义 boundary_mode 确定性选择比例
    kind: determinism
    definition: "全部 cycle（含 M1/M2 dispatch + M3/M4 数值）按 precedence 查表得到唯一 info_mode/boundary_mode"
    target: 1.0
  M2_D2_action_bound_realizability:  # 有效 cycle（M3/M4 数值门）上控制器约束行为正确
    kind: conformance
    definition: "final_delta == clip(requested_delta, L, U) 且 disposition 与唯一规则一致"
    target: 1.0
    note: "不要求每 cycle requested != final；约束是否真正改变动作是描述性统计（M2_cov），不是门目标"
  M2_cov:                        # 描述性：clip 实际生效（requested != final）的 cycle 占比；非门目标
    kind: descriptive
    definition: "M3/M4 数值 cycle 中 requested_delta != final_delta 的占比"
  M3_D3_recovery_trace_existence:    # 完整自然 recovery trace 计数（natural JPL test 单次暴露）
    kind: count
    minimum_traces: 20
    minimum_sessions: 5
    natural_only: true            # 只计 natural JPL；replay（caltech mask/inject）单列辅助，不计入
  M4_unsupported_release_prevention: # PROTECTIVE 下 allocated>actual 且 requested>0 时正向 release 比例
    kind: correctness
    definition: "PROTECTIVE cycle 中 final_delta > 0 的比例（clip_upper 到 0 不算 release）"
    target: 0.0

# --- Step0 kill gates（正式统计前；全部冻结 JPL train + 固定 Caltech replay；test 单次暴露前完成）---
step0_kill_gates:
  K1_D1_mode_selection:
    question: "信息面变化是否真的产生不同 boundary mode？（precedence 穷尽查表确定性）"
    fail_verdict: STOP            # D1 不成立
  K2_D2_action_set:
    question: "权限等级能否编码为数值 action set 并改变 accept/clip 行为？（controller-conformance replay 外生 probe）"
    fail_verdict: PROJECT_NO_GO   # 硬杀线，与 Gate 2 冻结规则一致
  K3_D3_recovery_trace:
    question: "是否存在不依赖通信恢复/停充/reset、由实际充电响应触发的 natural recovery trace？（JPL train）"
    fail_verdict: PROJECT_NO_GO   # 出口唯一化：JPL train natural trace = 0 → PROJECT_NO_GO；replay 不得救
  scope: "全部冻结 JPL train + 固定 Caltech replay（不挑样本）；probe/budget 外生规则冻结"

# --- 数据与切分 ---
data:
  primary_embodiment: jpl_current_only     # 自然 M3 域：pilot 不可用 → history protective boundary → action set
  pilot_rich_replay: caltech               # 信息面回放：mask pilot / truncate history / inject capability
  replay_role: mode_mechanism_replay       # 不是真实站点分布统计（协议必须明示）
  replay_reporting: "replay 结果单列辅助（mode-mechanism evidence），不计入 M3 natural trace"
  split:
    fit: jpl_train
    test: jpl_test_single_exposure
    office001: external_only               # 不得用于改任何阈值
  source_tables: E0 冻结 1-min 会话表
  test_domain_status: "JPL current-only test 域曾被 E3 分析；P2 只声称 outcome single exposure，
                       不得声称从未分析过的独立 test"

# --- 治理（继承 P1 fail-closed，P1-2）---
governance:
  manifest_fields: [code_sha, protocol_schema_sha, worktree_clean, runtime_ts]
  sentinel: "p2_sentinel.json；sentinel 一旦存在，任何 status 均视为 consumed（P2 outcome 单次暴露）"
  formal_rerun: PERMANENTLY_PROHIBITED

# --- 排除项（Gate 2 / P1 冻结，P2 不得重新引入）---
exclusions:
  - recent_var 高低作为核心状态规则
  - variance-defined S1/S2 作为状态判定
  - broad active redistribution（把差值给别人）
  - PV/BESS benefit / 经济收益指标
  - 为绕 prior art 的复杂度（risk score、双模型、classifier、learned recovery probability）
  - 把 mask replay 当作真实站点分布统计
  - 用 replay 结果"凑" natural recovery trace 计数
