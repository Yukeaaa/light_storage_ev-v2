    - p_1s_forward_fill_all
    - p_1s_forward_fill_exclude_first_15s
    - p_1s_forward_fill_exclude_first_30s
    - p_1s_forward_fill_exclude_first_60s
  energy:
    - e_15min_unfulfilled_all_nonzero_schedule
    - e_15min_unfulfilled_first_61h_nonzero_schedule
