experiment_id: CORE_SEARCH_R4A1S2
rule_version: core_search_r4a1s2_v1
frozen_date: 2026-09-03
protocol_source: "CORE_SEARCH R4-A1S follow-up: paper metric reproduction under S0 only"

dataset:
  name: "RWTH Aachen M5BAT schedule dataset"
  doi: "10.18154/RWTH-2025-06555"
  dataset_dir: "${data_root}\\RWTH\\Dataset"
  test_id: 2
  pairing: "S0_raw_label_direct_pairing"

published_anchors:
  rmse_kw: 13.87
  mean_absolute_deviation_kw: 3.31
  cumulative_unfulfilled_energy_kwh: 238.0
  first_major_curtailment_hour: 61.0
